name: Tool request
description: Propose a new tool or a change to an existing one.
title: "[tool request] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        A tool is added only when a real, named source backs it and its limits can be stated. Describe the real task, not a wish list.
  - type: textarea
    id: task
    attributes:
      label: The real task
      description: What an agent has to do, who needs the result and which decision or action it feeds.
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Source of truth
      description: The official register, API, regulation or dataset the answer must come from, with a link. Unknown is an acceptable answer.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example input and expected output
      render: json
    validations:
      required: false
  - type: input
    id: closest
    attributes:
      label: Closest existing tool, if any
      placeholder: ask_astranl
    validations:
      required: false
