<svg xmlns="http://www.w3.org/2000/svg" width="820" height="460" viewBox="0 0 820 460" role="img" aria-labelledby="t d" xml:space="preserve">
<title id="t">AstraNL MCP live demo: check_counterparty_nl on a real Dutch company, 2026-11-17</title>
<desc id="d">Animated terminal-style card showing a real live call to the public AstraNL MCP endpoint https://astranl.com/mcp/streamable on 2026-11-17T20:03:44Z, with no API key. initialize returned HTTP 200 from astranl-mcp 1.37.43 in 151 ms; tools/list returned 41 tools in 38 ms. Example question: Before I approve ASML Holding N.V. as a supplier: is the KvK registration active, does the VAT number pass VIES, and is there any EU sanctions or insolvency hit? Tool check_counterparty_nl was called with kvk_number 17085815, company_name ASML Holding N.V., vat_number NL803441526B01 and answered HTTP 200 in 7059 ms. Result: registry active_registration true; VIES valid true, vies_name_vs_register EXACT; sanctions hit_count 0; insolvency found false, cases 0; name_check EXACT; open_questions empty; check_id ASTRA-K-B21F4BD346A24DA3. The response says it does not prove: who may sign or order for the company; solvency, credit risk or reliability. The client recomputed result_sha256 b21f4bd346a24da336a3b96e98925b49f90b094ffebf348ebe23d56d9e45dd24 and it matched. Latency was measured on the AstraNL host, so internet transit is not included. Not a customer job.</desc>
